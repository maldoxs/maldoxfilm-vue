<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0e0e" />
    <!-- Fondo oscuro ANTES de que cargue la hoja de estilos. Sin esto el navegador
         pinta blanco mientras llega el CSS, y eso es el fogonazo que se ve al pasar
         de un reproductor a otro: la página embebida recarga la app y cada recarga
         empieza con una pantalla en blanco. El valor es el mismo `--bg` de style.css. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0e0e0e;
      }
    </style>
    <title>maldoxfilm-vue</title>
    <!-- Fuentes — Oswald (logo/hero/TOP) + Roboto, igual que producción (índex.html ~8-22). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Oswald:wght@500;600;700;900&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
